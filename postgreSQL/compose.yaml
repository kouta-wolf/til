services:
  postgres:
    image: postgres:16
    container_name: sql_practice
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
      POSTGRES_DB: dvdrental
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/tmp/data:ro

volumes:
  pgdata:
